name: API Tests (Newman CI)

on:
  push:
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Run GoRest API tests (DDT with users.csv)
        run: |
          newman run 2474802010510_NguyenVietHai_GoRest.postman_collection.json \
            -e 2474802010510_NguyenVietHai_GoRest_Env.postman_environment.json \
            -d users.csv \
            --env-var "token=${{ secrets.GOREST_TOKEN }}"
