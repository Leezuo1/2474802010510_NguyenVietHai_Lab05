name: API Monitor (Shift-Right)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Check GET /users (response time < 800ms)
        run: |
          newman run 2474802010510_NguyenVietHai_GoRest.postman_collection.json \
            -e 2474802010510_NguyenVietHai_GoRest_Env.postman_environment.json \
            --folder "Monitor" \
            --env-var "token=${{ secrets.GOREST_TOKEN }}"
